<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oro 3D map harness</title>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var theme = q.get('theme') === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: var(--bg, #070a12); color: var(--text, #e8ecf6); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    .stage { position: fixed; inset: 0; }
    .viewport { position: absolute; inset: 0; overflow: hidden; }
    .panel {
      position: fixed; left: 12px; top: 12px; z-index: 10; width: 250px; max-height: calc(100% - 24px); overflow: auto;
      padding: 10px 12px; border-radius: 12px; background: var(--glass-strong, rgba(10,14,25,0.82));
      border: 1px solid var(--border-2, rgba(148,166,214,0.18)); backdrop-filter: blur(12px);
    }
    .panel h1 { font-size: 13px; margin: 0 0 6px; letter-spacing: .04em; }
    .row { display: flex; align-items: center; gap: 6px; margin: 5px 0; flex-wrap: wrap; }
    .row label { width: 62px; color: var(--text-2, #adb6cb); }
    .row input[type=range] { flex: 1; min-width: 0; }
    button, select { font: inherit; color: inherit; background: var(--panel-2, #121929); border: 1px solid var(--border-2, #333); border-radius: 6px; padding: 3px 7px; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus, #a6c5ff); outline-offset: 1px; }
    #stats { font: 11px/1.3 ui-monospace, monospace; color: var(--text-3, #8d97ae); white-space: pre; margin-top: 6px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="stage" aria-label="3D map">
    <div class="viewport" data-viewport></div>
  </main>
  <aside class="panel" id="panel" aria-label="Harness controls">
    <h1>Oro 3D map harness</h1>
    <div class="row"><button id="theme">Theme</button><button data-view="orbit">Orbit</button><button data-view="top">Top</button><button data-view="low">Low</button></div>
    <div class="row"><label for="part">Part</label><select id="part"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option></select>
      <select id="mode" aria-label="Dot mode"><option value="0">Pin</option><option value="1">Roll</option><option value="2">Drift</option><option value="3">Explore</option><option value="4">Tour</option></select></div>
    <div class="row"><button id="tourDemo">Waypoints</button><select id="tourMode" aria-label="Tour mode"><option value="0">Loop</option><option value="1">Ping-pong</option><option value="2">Once</option></select><button id="edit">Edit</button></div>
    <div class="row"><button id="lockDemo">Locks</button><button id="seq">Seq play</button></div>
    <div class="row"><label for="quality">Quality</label><select id="quality"><option>high</option><option>medium</option><option>low</option></select></div>
    <div class="row"><label for="style">Style</label><select id="style"><option>relief</option><option>wire</option><option>contour</option><option>heat</option><option>points</option></select></div>
    <div class="row"><label for="palette">Palette</label><select id="palette"></select></div>
    <div class="row"><label for="tA">Terrain A</label><select id="tA"></select></div>
    <div class="row"><label for="tB">Terrain B</label><select id="tB"></select></div>
    <div class="row"><label for="path">Path</label><select id="path"></select><input id="order" type="number" min="1" max="8" value="2" style="width:40px" aria-label="Order"></div>
    <div id="sliders"></div>
    <div class="row"><button id="play">Arp on/off</button><button id="lfo">LFO demo</button><button id="rot">Auto-rotate</button></div>
    <div id="stats"></div>
  </aside>
  <script type="module" src="./main.js"></script>
</body>
</html>
